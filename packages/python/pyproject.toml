[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vietflex-webgis"
version = "0.1.0"
description = "Reusable Python GIS helpers for the Vietflex WebGIS ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vietflexmap" }]
dependencies = ["pyproj>=3.6", "shapely>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/vietflex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
